name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # angular.json writes to ../../dotnet_api/wwwroot, which does not exist on the runner
      - name: Build (production)
        run: npx ng build --configuration production --output-path dist

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
